<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 520 640" role="img" aria-labelledby="mpc-t mpc-d" width="520" height="640">
<title id="mpc-t">Création d&#x27;un MULTIPASS : de l&#x27;email aux clés</title>
<desc id="mpc-d">L&#x27;email du titulaire sert d&#x27;identifiant. Un SALT et un PEPPER aléatoires de 24 caractères sont tirés. Le PEPPER est isolé par constellation grâce au sel dérivé de UPLANETNAME, qui vaut 64 zéros en ORIGIN ou la clé partagée en ẐEN. Un étirement scrypt donne une graine ed25519, d&#x27;où viennent la clé Nostr, la clé Ğ1 et l&#x27;identité IPNS. Une autre constellation donne d&#x27;autres clés pour le même SALT et PEPPER. La carte d&#x27;identité, avec SALT, PEPPER, nsec, code PASS et jeton, n&#x27;est affichée qu&#x27;une seule fois.</desc>
<style>
.ill{--ink:#1b1f2a;--mut:#454c61;--pan:#eef1f9;--pan2:#e2e8f8;--line:#6b7390;--acc:#2a46c8;--ok:#14663a;--warn:#8f3b06;--bg:#ffffff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){.ill{--ink:#eef0f8;--mut:#bcc3da;--pan:#1c2133;--pan2:#262d47;--line:#8790ad;--acc:#9bb0ff;--ok:#7fdca6;--warn:#ffb98a;--bg:#12151f}}
.ill .bg{fill:var(--bg)}.ill .pan{fill:var(--pan);stroke:var(--line);stroke-width:1.5}.ill .pan2{fill:var(--pan2);stroke:var(--acc);stroke-width:2}
.ill .okp{fill:var(--pan);stroke:var(--ok);stroke-width:2.5}.ill .wnp{fill:var(--pan);stroke:var(--warn);stroke-width:2.5}
.ill .t{fill:var(--ink);font-size:17px;font-weight:700}.ill .s{fill:var(--mut);font-size:14.5px}.ill .a{fill:var(--acc);font-size:15px;font-weight:700}
.ill .g{fill:var(--ok);font-size:15px;font-weight:700}.ill .w{fill:var(--warn);font-size:15px;font-weight:700}
.ill .ln{stroke:var(--line);stroke-width:2;fill:none}.ill .ar{stroke:var(--acc);stroke-width:2.5;fill:none}.ill .ds{stroke:var(--acc);stroke-width:2.5;fill:none;stroke-dasharray:7 6}
.ill .hd{fill:var(--acc)}.ill .m{text-anchor:middle}
</style>
<rect class="bg" width="520" height="640" rx="14"/>
<text x="260" y="34" class="t m">Créer un MULTIPASS : de l&#x27;email aux clés</text>
<rect class="pan" x="20" y="52" width="480" height="58" rx="10"/>
<text x="260.0" y="76" class="t m">1 · Votre email</text>
<text x="260.0" y="97" class="s m">astroportd multipass create &lt;email&gt;</text>
<path class="ar" d="M260 110 L260 142"/>
<path class="hd" d="M260 142 L256.1 133.9 L263.9 133.9 Z"/>
<text x="274" y="132" class="a">tirage aléatoire</text>
<rect class="pan" x="20" y="142" width="480" height="58" rx="10"/>
<text x="260.0" y="166" class="t m">2 · SALT + PEPPER</text>
<text x="260.0" y="187" class="s m">24 caractères alphanumériques chacun</text>
<path class="ar" d="M260 200 L260 232"/>
<path class="hd" d="M260 232 L256.1 223.9 L263.9 223.9 Z"/>
<text x="274" y="222" class="a">sel de la constellation</text>
<rect class="pan2" x="20" y="232" width="480" height="66" rx="10"/>
<text x="260.0" y="256" class="t m">3 · PEPPER isolé par constellation</text>
<text x="260.0" y="277" class="s m">(SALT, PEPPER_&lt;sha256(UPLANETNAME)[:16]&gt;)</text>
<text x="260.0" y="296" class="s m">ORIGIN : 64 zéros · ẐEN : votre swarm.key</text>
<path class="ar" d="M260 298 L260 330"/>
<path class="hd" d="M260 330 L256.1 321.9 L263.9 321.9 Z"/>
<text x="274" y="320" class="a">scrypt</text>
<rect class="pan2" x="20" y="330" width="480" height="50" rx="10"/>
<text x="260.0" y="361.0" class="t m">4 · Une graine ed25519</text>
<path class="ln" d="M260 380 L260 396 M90 396 L430 396"/>
<path class="ar" d="M90 396 L90 410"/>
<rect class="okp" x="20" y="410" width="140" height="62" rx="10"/>
<text x="90.0" y="434" class="t m">Nostr</text>
<text x="90.0" y="455" class="s m">sha256 de la graine</text>
<path class="ar" d="M260 396 L260 410"/>
<rect class="okp" x="190" y="410" width="140" height="62" rx="10"/>
<text x="260.0" y="434" class="t m">Ğ1</text>
<text x="260.0" y="455" class="s m">même graine</text>
<path class="ar" d="M430 396 L430 410"/>
<rect class="okp" x="360" y="410" width="140" height="62" rx="10"/>
<text x="430.0" y="434" class="t m">IPNS</text>
<text x="430.0" y="455" class="s m">même graine</text>
<text x="260" y="500" class="w m">Autre constellation = autres clés pour le même SALT/PEPPER</text>
<rect class="wnp" x="20" y="516" width="480" height="104" rx="12"/>
<text x="260" y="544" class="t m">La carte à noter UNE seule fois</text>
<text x="260" y="568" class="s m">SALT · PEPPER · nsec · code PASS · jeton web</text>
<text x="260" y="590" class="s m">c&#x27;est ce qui permet de retrouver le compte</text>
<text x="260" y="610" class="s m">(carte téléchargeable en .txt sur /register)</text>
</svg>
