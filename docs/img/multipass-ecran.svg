<svg xmlns="http://www.w3.org/2000/svg" class="ill" viewBox="0 0 520 460" role="img" aria-labelledby="mpe-t mpe-d" width="520" height="460">
<title id="mpe-t">Schéma de l&#x27;écran MULTIPASS</title>
<desc id="mpe-d">Le tableau de bord de l&#x27;interface web montre des cartes : solde, autonomie, empreinte sur les communs, souveraineté, puis deux cartes distinctes, Ẑen Opex pour les redevances d&#x27;usage et Ẑen Capex pour les parts d&#x27;investissement, enfin la copie privée.</desc>
<style>
.ill{--ink:#1b1f2a;--mut:#454c61;--pan:#eef1f9;--pan2:#e2e8f8;--line:#6b7390;--acc:#2a46c8;--ok:#14663a;--warn:#8f3b06;--bg:#ffffff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){.ill{--ink:#eef0f8;--mut:#bcc3da;--pan:#1c2133;--pan2:#262d47;--line:#8790ad;--acc:#9bb0ff;--ok:#7fdca6;--warn:#ffb98a;--bg:#12151f}}
.ill .bg{fill:var(--bg)}.ill .pan{fill:var(--pan);stroke:var(--line);stroke-width:1.5}.ill .pan2{fill:var(--pan2);stroke:var(--acc);stroke-width:2}
.ill .okp{fill:var(--pan);stroke:var(--ok);stroke-width:2.5}.ill .wnp{fill:var(--pan);stroke:var(--warn);stroke-width:2.5}
.ill .t{fill:var(--ink);font-size:17px;font-weight:700}.ill .s{fill:var(--mut);font-size:14.5px}.ill .a{fill:var(--acc);font-size:15px;font-weight:700}
.ill .g{fill:var(--ok);font-size:15px;font-weight:700}.ill .w{fill:var(--warn);font-size:15px;font-weight:700}
.ill .ln{stroke:var(--line);stroke-width:2;fill:none}.ill .ar{stroke:var(--acc);stroke-width:2.5;fill:none}.ill .ds{stroke:var(--acc);stroke-width:2.5;fill:none;stroke-dasharray:7 6}
.ill .hd{fill:var(--acc)}.ill .m{text-anchor:middle}
</style>
<rect class="bg" width="520" height="460" rx="14"/>
<text x="260" y="34" class="t m">L&#x27;écran MULTIPASS (schéma)</text>
<rect class="pan" x="16" y="52" width="488" height="470" rx="12"/>
<rect class="pan2" x="16" y="52" width="488" height="42" rx="12"/>
<text x="30" y="79" class="t">Astroport</text>
<text x="150" y="79" class="a">Tableau de bord</text>
<text x="290" y="79" class="s">uCloud</text>
<text x="360" y="79" class="s">Visages &amp; BRO</text>
<rect class="pan" x="28" y="108" width="224" height="70" rx="10"/>
<text x="140.0" y="132" class="t m">Solde</text>
<text x="140.0" y="153" class="s m">… Ẑen · … Ğ1</text>
<rect class="pan" x="268" y="108" width="224" height="70" rx="10"/>
<text x="380.0" y="132" class="t m">Autonomie</text>
<text x="380.0" y="153" class="s m">semaines de loyer</text>
<rect class="pan" x="28" y="192" width="224" height="70" rx="10"/>
<text x="140.0" y="216" class="t m">Empreinte</text>
<text x="140.0" y="237" class="s m">disque utilisé / quota</text>
<rect class="pan" x="268" y="192" width="224" height="70" rx="10"/>
<text x="380.0" y="216" class="t m">Souveraineté</text>
<text x="380.0" y="237" class="s m">fichiers chiffrés</text>
<rect class="wnp" x="28" y="276" width="224" height="70" rx="10"/>
<text x="140.0" y="300" class="t m">Ẑen Opex</text>
<text x="140.0" y="321" class="s m">usage : loyer</text>
<rect class="okp" x="268" y="276" width="224" height="70" rx="10"/>
<text x="380.0" y="300" class="t m">Ẑen Capex</text>
<text x="380.0" y="321" class="s m">parts : capital, amorti</text>
<rect class="pan" x="28" y="360" width="464" height="70" rx="10"/>
<text x="260.0" y="384" class="t m">Copie privée (CPI L. 122-5)</text>
<text x="260.0" y="405" class="s m">attestation avant tout dépôt de film ou série</text>
</svg>
