name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Chaîne figée : les avertissements clippy d'une version plus récente ne doivent pas casser la CI sans prévenir.
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config ffmpeg
      - name: Clippy (aucun avertissement toléré)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: "Clippy avec l'inférence locale (fonction onnx : compilation seule, libonnxruntime est chargée à l'exécution)"
        run: cargo clippy -p astroportd -p astro-facecloud --all-targets --features onnx --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Règles de l'interface (JavaScript pur, sans navigateur) : cockpit, accueil, traductions, replaceChildren…
        run: for t in crates/astro-ui/tests/*.mjs; do echo "▶ $t"; node "$t"; done
      - name: Guide illustré à jour (docs/index.html se reconstruit depuis docs/GUIDE.md)
        run: |
          pip install markdown-it-py
          python3 docs/build_guide.py --check
      - name: Scripts shell
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck
          bash -n install.sh build-all.sh
          shellcheck install.sh build-all.sh

  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    # Première CI macOS : le binaire n'avait jamais été compilé sur ce système. Non bloquante tant qu'elle n'a pas été
    # verte une fois ; retirer `continue-on-error` ensuite.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: brew install ffmpeg pkg-config
      - name: Clippy (aucun avertissement toléré)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: "Clippy avec l'inférence locale (libonnxruntime.dylib est chargée à l'exécution)"
        run: cargo clippy -p astroportd -p astro-facecloud --all-targets --features onnx --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
