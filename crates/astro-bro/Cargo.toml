[package]
name = "astro-bro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
astro-core.workspace = true
astro-crypto.workspace = true
astro-db.workspace = true
astro-nostr-proto.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
regex.workspace = true
zeroize.workspace = true
thiserror.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
# Embeddings locaux (bge-m3 int8) par ONNX Runtime chargé à l'exécution, sans Ollama : voir `OrtEmbedder`.
onnx = ["dep:ort", "dep:tokenizers"]

[lints]
workspace = true
