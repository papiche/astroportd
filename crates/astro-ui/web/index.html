<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Astroport</title>
<meta name="theme-color" content="#3b5bdb">
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="icon" href="/ui/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/ui/m-shell.css">
<link rel="modulepreload" href="/ui/m-routes.js">
<link rel="modulepreload" href="/ui/m-shell.js">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header>
  <h1><img src="/ui/icon.svg" alt="" width="28" height="28"> <span>Astroport</span></h1>
  <nav aria-label="Mon espace">
    <a href="#/" data-r="home"><span class="ic" aria-hidden="true">🏠</span><span class="lb">Accueil</span></a>
    <a href="#/cloud" data-r="files"><span class="ic" aria-hidden="true">🗂️</span><span class="lb">Fichiers</span></a>
    <a href="#/people" data-r="people"><span class="ic" aria-hidden="true">👥</span><span class="lb">Proches</span></a>
    <a href="#/account" data-r="me"><span class="ic" aria-hidden="true">⚙️</span><span class="lb">Moi</span></a>
  </nav>
  <div class="tools">
    <select id="style" aria-label="Style de l'interface" title="Style">
      <option value="aurore">Aurore</option>
      <option value="sobre">Sobre</option>
      <option value="kraft">Kraft</option>
    </select>
    <button id="mode" class="ghost" type="button" aria-label="Clair, sombre ou automatique" title="Clair / sombre / auto">◐</button>
    <button id="out" type="button" title="Déconnexion" hidden>Déconnexion</button>
  </div>
</header>
<main id="main" tabindex="-1"><p class="muted">Chargement…</p></main>

<dialog id="login" aria-labelledby="login-t">
  <form method="dialog" id="login-f">
    <h2 id="login-t">Connexion</h2>
    <p class="muted">Adresse email (ou clé), puis votre code PASS (4 à 6 chiffres) ou le jeton de la station.</p>
    <label>Identifiant <input name="u" autocomplete="username" required></label>
    <label>PASS ou jeton <input name="p" type="password" autocomplete="current-password" required></label>
    <p class="muted">Pas de compte ? <a href="/register">Créer mon MULTIPASS</a> · <a href="/stations">Stations proches</a></p>
    <p id="login-e" class="err" role="alert"></p>
    <menu>
      <button type="button" id="login-n" hidden>Extension Nostr</button>
      <button value="ok">Se connecter</button>
    </menu>
  </form>
</dialog>

<dialog id="view" aria-label="Visionneuse">
  <button type="button" class="x" id="view-x" aria-label="Fermer">×</button>
  <button type="button" class="nav prev" id="view-p" aria-label="Photo précédente">‹</button>
  <div id="view-b"></div>
  <button type="button" class="nav next" id="view-n" aria-label="Photo suivante">›</button>
  <p id="view-t" class="muted"></p>
</dialog>

<dialog id="share" aria-labelledby="share-t">
  <button type="button" class="x" id="share-x" aria-label="Fermer">×</button>
  <h2 id="share-t">Lien magique</h2>
  <div id="share-b"></div>
</dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
