[package]
name = "resonance"
version = "0.1.0"
edition = "2024"
description = "Plugin d'exemple pour astro-plugins : clé dérivée et résonance entre deux textes"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
sha2 = "0.10"

# Hors du workspace d'astroportd : ce crate se compile pour wasm32-unknown-unknown (voir plugins/build.sh).
[workspace]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
